<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse all Rainy Days products" />
    <title>Rainy Days | Products</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link href="src/css/reset.css" rel="stylesheet" />
    <link href="src/css/variables.css" rel="stylesheet" />
    <link href="src/css/main.css" rel="stylesheet" />
    <link href="src/css/products.css" rel="stylesheet">
    <link href="src/css/responsive.css" rel="stylesheet" />
    <link href="src/css/home.css" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="main-nav">
        <div class="nav-container">
          <div class="nav-left">
            <a href="coming-soon.html">
              <i class="fa-solid fa-bars"></i>
            </a>
          </div>

          <a href="index.html">
            <img
              src="assets/images/icons/RainyDays_Logo-WHITE.png"
              class="nav-logo"
              alt="Rainy Days logo"
            />
          </a>

          <div class="nav-right">
            <a href="coming-soon.html">
              <i
                class="fa-solid fa-magnifying-glass"
              ></i>
            </a>
            <a href="cart.html" class="cart-icon" aria-label="Shopping cart">
              <i class="fa-solid fa-bag-shopping"></i>
              <span id="cart-count"></span>
            </a>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="featured-products">
        <h1>All Products</h1>

        <div class="filters">
          <select id="gender-filter">
            <option value="all">All Products</option>
            <option value="Male">Men</option>
            <option value="Female">Women</option>
          </select>

          <select id="price-filter">
            <option value="default">Sort: Relevance</option>
            <option value="low-high">Price: Low to High</option>
            <option value="high-low">Price: High to Low</option>
          </select>
        </div>

        <div id="products-container">
          <!-- JS goes here -->
        </div>
      </section>

      <div id="loader">
        <p>Loading products...</p>
      </div>

      <div id="error"></div>
    </main>
    <footer>
      <div class="footer-layout">
        <div class="support">
          <h2>Support</h2>
          <ul>
            <li><a href="coming-soon.html">Contact us</a></li>
            <li><a href="coming-soon.html">Find a store</a></li>
            <li><a href="coming-soon.html">Order status</a></li>
            <li><a href="coming-soon.html">Returns</a></li>
            <li><a href="coming-soon.html">Size guides</a></li>
            <li><a href="coming-soon.html">Promotions</a></li>
            <li><a href="coming-soon.html">Gift cards</a></li>
            <li><a href="coming-soon.html">FaQ</a></li>
          </ul>
        </div>
        <div class="footer-middle">
          <div class="social">
            <h2>Our social media</h2>
            <div class="social-icons">
              <i class="fa-brands fa-instagram"></i>
              <i class="fa-brands fa-x-twitter"></i>
              <i class="fa-brands fa-facebook-f"></i>
              <i class="fa-brands fa-tiktok"></i>
            </div>
          </div>
          <div class="newsletter">
            <h2>Join our email list</h2>
            <div>
              <input
                type="text"
                name="email"
                id="email"
                placeholder="Email Address*"
                aria-label="Email address"
              />
              <label>
                <input type="checkbox" />
                <span>I agree to the Privacy Policy & Terms of Use</span>
              </label>
            </div>
          </div>
        </div>
        <img
          loading="lazy"
          src="assets/images/icons/RainyDays_Logo-WHITE.png"
          alt="Rainy Days logo"
        />
      </div>
      <div class="info-links">
        <ul>
          <li><a href="privacy-policy.html">Privacy Policy</a></li>
          <li><a href="terms-of-use.html">Terms of Use</a></li>
          <li><a href="coming-soon.html">Cookie Preferences</a></li>
        </ul>
      </div>
    </footer>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
